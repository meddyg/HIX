name: Pages

# Builds the IG and deploys it to Cloudflare Pages:
#
#   pull request  -> https://pr-N.hix-ig.pages.dev/fhir/hix/            preview
#   push to dev   -> https://dev.hix-ig.pages.dev/fhir/hix/             recent changes
#   push to main  -> https://hix.meddyg.com/fhir/hix/                   the published guide
#   tag vX.Y.Z    -> https://vX-Y-Z.hix-ig-versions.pages.dev/fhir/hix/  frozen copy of that version
#
# main is the production branch of the hix-ig Pages project, so what merges
# into main is what hix.meddyg.com serves. A tag publishes nothing new there: it
# keeps a copy of that version that later merges do not change.
#
# Closing a pull request deletes its preview deployments.
#
# Needs the CLOUDFLARE_API_TOKEN (permission: Cloudflare Pages, Edit) and
# CLOUDFLARE_ACCOUNT_ID secrets, and two Pages projects: hix-ig, whose production
# branch is `main`, and hix-ig-versions, which holds one branch per version.

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

# Pull requests are grouped by number: a merged PR's `closed` event runs with
# main's ref, and would otherwise cancel main's deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - uses: pnpm/setup@v2
        with:
          version: "12"
          runtime: node@24
          install: false

      - name: Install Jekyll and SUSHI
        run: |
          gem install jekyll --no-document
          pnpm add --global fsh-sushi

      - name: Download the IG Publisher
        run: make tools

      - name: Build the site
        run: make site

      # llms.txt is a plain-text index for LLMs, built from the same pages by
      # the scripts the PDF uses. It needs Python only, no pandoc or typst.
      - name: Build llms.txt
        run: |
          work=$(mktemp -d)
          python3 _scripts/assemble.py "$work"
          python3 _scripts/llms.py "$work"

      # The site lives under the canonical's path, so the canonical URL resolves;
      # the root redirects to it.
      - name: Bundle
        run: |
          mkdir -p dist/pages/fhir
          cp -R dist/site dist/pages/fhir/hix
          # beside the site, where llms.txt links to the full text, and at the
          # root of the domain, where the llms.txt convention looks for it
          cp dist/llms.txt dist/llms-full.txt dist/md/*.md dist/pages/fhir/hix/
          cp dist/llms.txt dist/pages/llms.txt
          echo "/ /fhir/hix/ 302" > dist/pages/_redirects

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REF_TYPE: ${{ github.ref_type }}
          REF: ${{ github.ref_name }}
        run: |
          # pnpm blocks install scripts unless allowed; wrangler's dependencies need these two.
          deploy() {
            pnpm dlx --allow-build=esbuild --allow-build=workerd wrangler@4 \
              pages deploy dist/pages --project-name "$1" --branch "$2"
          }
          if [ "$EVENT" = pull_request ]; then
            deploy hix-ig "pr-$PR"
          elif [ "$REF_TYPE" = tag ]; then
            deploy hix-ig-versions "$REF"
          else
            deploy hix-ig "$REF" # dev is a preview; main is production
          fi

      # One comment per PR, updated on every push.
      - name: Comment the preview on the PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: preview
          message: |
            🔎 Vista previa desplegada: https://pr-${{ github.event.pull_request.number }}.hix-ig.pages.dev/fhir/hix/

            Commit: `${{ github.event.pull_request.head.sha }}`

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete the PR's preview deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: pr-${{ github.event.pull_request.number }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/pages/projects/hix-ig/deployments"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          # Collect every page first: deleting while paging would shift the pages.
          page=1 total=1 ids=""
          while [ "$page" -le "$total" ]; do
            res=$(curl -fsS -H "$auth" "$api?env=preview&per_page=25&page=$page")
            total=$(jq '.result_info.total_pages // 1' <<<"$res")
            ids+=" $(jq -r --arg b "$BRANCH" '.result[] | select(.deployment_trigger.metadata.branch == $b) | .id' <<<"$res")"
            page=$((page + 1))
          done
          # force=true also deletes the deployment the pr-N alias points to.
          for id in $ids; do
            curl -fsS -X DELETE -H "$auth" "$api/$id?force=true" > /dev/null
            echo "Deleted $BRANCH deployment $id"
          done
