name: Pages

# Builds the IG and deploys it to Cloudflare Pages:
#
#   pull request  -> https://pr-N.hix-ig.pages.dev/fhir/hix/            preview
#   push to main  -> https://main.hix-ig.pages.dev/fhir/hix/            ci-build
#   tag vX.Y.Z    -> https://hl7.meddyg.com/fhir/hix/                   production
#                    https://vX-Y-Z.hix-ig-versions.pages.dev/fhir/hix/  frozen copy
#
# Needs the CLOUDFLARE_API_TOKEN secret (permission: Cloudflare Pages, Edit), the
# CLOUDFLARE_ACCOUNT_ID variable, and two Pages projects, hix-ig and
# hix-ig-versions, whose production branch is `production`.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - uses: pnpm/setup@v2
        with:
          version: "12"
          runtime: node@24
          install: false

      - name: Install Jekyll and SUSHI
        run: |
          gem install jekyll --no-document
          pnpm add --global fsh-sushi

      - name: Download the IG Publisher
        run: make tools

      - name: Build the site
        run: make site

      # The site lives under the canonical's path, so the canonical URL resolves;
      # the root redirects to it.
      - name: Bundle
        run: |
          mkdir -p dist/pages/fhir
          cp -R dist/site dist/pages/fhir/hix
          echo "/ /fhir/hix/ 302" > dist/pages/_redirects

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          # pnpm blocks install scripts unless allowed; wrangler's dependencies need these two.
          deploy() {
            pnpm dlx --allow-build=esbuild --allow-build=workerd wrangler@4 \
              pages deploy dist/pages --project-name "$1" --branch "$2"
          }
          if [ "$EVENT" = pull_request ]; then
            deploy hix-ig "pr-$PR"
          elif [ "$REF_TYPE" = tag ]; then
            deploy hix-ig production
            deploy hix-ig-versions "$TAG"
          else
            deploy hix-ig main
          fi

      # One comment per PR, updated on every push.
      - name: Comment the preview on the PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: preview
          message: |
            🔎 Vista previa desplegada: https://pr-${{ github.event.pull_request.number }}.hix-ig.pages.dev/fhir/hix/

            Commit: `${{ github.event.pull_request.head.sha }}`
