name: Error o imprecision en la guía
description: Algo que la especificación dice y está mal, es ambiguo o contradice al perfil de origen.
labels: ["Type: Content", "Type: Bug"]
body:
  - type: input
    id: ubicacion
    attributes:
      label: Página y sección
      description: Por ejemplo, volume-1-concepts.md, sección 2.1.3, o el enlace a la sección en el sitio.
    validations:
      required: true
  - type: textarea
    id: dice
    attributes:
      label: Qué dice hoy
      description: Cite el texto tal como está.
    validations:
      required: true
  - type: textarea
    id: problema
    attributes:
      label: Por qué es incorrecto
      description: Si contradice a una especificación, enlace la sección exacta y cite su texto literal.
    validations:
      required: true
  - type: textarea
    id: propuesta
    attributes:
      label: Corrección propuesta
      description: Opcional. La redacción que debería quedar.
  - type: checkboxes
    id: conducta
    attributes:
      label: Antes de enviar
      options:
        - label: He leído el [Código de Conducta](https://github.com/meddyg/Health-Information-Exchange/blob/main/CODE_OF_CONDUCT.md) y esto no es un hallazgo de seguridad.
          required: true
