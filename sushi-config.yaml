# produces -- which is exactly what a narrative-only specification needs.
#
# Reference: https://fshschool.org/docs/sushi/configuration/

id: meddyg.hix
packageId: meddyg.hix
canonical: https://hl7.meddyg.com/fhir/hix
name: HixHealthInformationExchange
title: Health Information Exchange
description: >-
  Specification of the hix health information exchange: a Document Sharing
  community built on the IHE MHDS profile, together with the authorization,
  identity, directory and audit mechanisms that surround it.
